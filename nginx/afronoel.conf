# Configuration Nginx pour AfroNoel
# Domaine: tmc.supahuman.site

upstream afronoel_app {
    server unix:/var/www/afronoel/afronoel.sock;
}

server {
    listen 80;
    server_name tmc.supahuman.site www.tmc.supahuman.site;
    
    # Redirection vers HTTPS (après configuration SSL)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tmc.supahuman.site www.tmc.supahuman.site;

    # Certificats SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tmc.supahuman.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmc.supahuman.site/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Configuration SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Logs
    access_log /var/log/nginx/afronoel_access.log;
    error_log /var/log/nginx/afronoel_error.log;

    # Taille maximale des uploads (pour les images produits)
    client_max_body_size 20M;

    # Fichiers statiques
    location /static/ {
        alias /var/www/afronoel/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers media (images uploadées)
    location /media/ {
        alias /var/www/afronoel/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Favicon
    location /favicon.ico {
        alias /var/www/afronoel/staticfiles/favicon.ico;
        expires 30d;
        access_log off;
    }

    # Application Django via Gunicorn
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://afronoel_app;
        proxy_redirect off;
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\. {
        deny all;
    }

    location ~ ^/(\.git|\.env|manage\.py) {
        deny all;
    }
}
